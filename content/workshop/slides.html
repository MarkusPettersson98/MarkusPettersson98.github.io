            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){

### Vad är övervakning?
<img src="IMÄI/Workshop/images/kamera.png" alt="" style="width: 500px; object-fit: fill">
</div>

<aside class="notes"><p>Alla har känt känslan av att vara övervakad. Någon iaktar dig, tjuvlyssnar. Ibland är det väldigt obvious, ibland får du reda på det först i efterhand.</p>
<p>Det gör att man kan bli: rädd, ledsen, nervös, paranoid, medan det vanligaste argumentet för att använda övervakning är det motsatta: vi övervakar för att ge trygghet, skydda någon eller någonting. Övervakning på allmäna platser ska fungera som en trygghet mot brott och övergrepp. Men i dom argumenten skiner den repressiva, förtryckande kraften igenom: övervakning ska hindra människor från att begå vissa handlingar. För en kamera skyddar inte mot någon som faktiskt utför en handling, går till attack, klottrar, slår in ett fönster. Poängen är att pacificera, och kunna straffa vid ett annat tillfälle än när övervakningen i sig sker. Annan övervakning finns till för att tvinga fram vissa beteenden från folk, exempelvis minutstyrningen av hemtjänstpersonal, eller cykelbudet, eller lagerarbetaren. Censur är ett ett annat vanligt ändamål med övervakning, men vi återkommer till det när jag ska prata mer om internet.</p>
</aside></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->

#### [AI-assisted targeting in the Gaza Strip](https://en.wikipedia.org/wiki/AI-assisted_targeting_in_the_Gaza_Strip)
<img src="IMÄI/Workshop/images/heron-drone.jpg" alt="" style="object-fit: scale-down">
</div>

<aside class="notes"><p>Ett mycket skrämmande exempel kommer från Palestina. Israel spelade in internettrafik från Gazaremsan och Västbanken i syfte att kartlägga Palestinska män, och om dom kunde tros ha samröre med Hamas. Tro är viktigt här, för i princip all internettrafik idag är krypterad, vilket betyder att det i princip är omöjligt att läsa av det faktiska innehållet i exempelvis ett meddelande, vad någon gör på en hemsida osv. Men baserat på <em>vart internettrafiken var påväg</em>, &amp;
<em>med vilken frekvens</em> och annan <em>omkringliggande information</em> identifierade och klassificerade en A.I. potentiella hot. Om ett mål kom över en viss poäng så bombade Israel platsen med drönare.</p>
<p>Det här är ett exempel på när övervakning används för att samla in så kallad metadata. Metadata är <em>information om data</em>, snarare än datan i sig. Ni kan föreställa er att kuvertet runt ett brev är metadatan, medans brevet (själva kommunikationen) är datan. Brevbäraren vet såklart vem du vill prata med, när, hur mycket brevet väger osv.</p>
<p>Insamling av metadata i övervakningssyfte har tyvärr blivit mycket mer användbart i takt med att A.I. utvecklats. Anledningen till det är det ofta gömmer sig mönster i metadata, och givet nog mycket data och avancerade A.I. modeller kan man någon dra slutsatser utifrån dom här mönstrena. Och ibland behövs inte alls många datapunkter - att några här tackat ja till facebook-eventet för idag visar att ni har samröre med varandra, och att det är i ett vänsterautonomt sammanhang.</p>
</aside></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->

### Svensk lag
- 1992 - [Yttrandefrihet skrivs in i grundlagen](https://sv.wikipedia.org/wiki/Yttrandefrihetsgrundlagen)
- 1993 - [Telelagen](https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/telelag-1993597_sfs-1993-597/)
- 2008 - [FRA-lagen](https://sv.wikipedia.org/wiki/FRA-lagen)
- 2024 - [Utökade möjligheter att använda preventiva tvångsmedel vid brottsbekämpning](https://www.riksdagen.se/sv/dokument-och-lagar/dokument/betankande/preventiva-tvangsmedel-for-att-forebygga-och_hb01juu24/)
- 2025 - [Hemliga och preventiva tvångsmedel mot barn under 15 år](https://www.regeringen.se/pressmeddelanden/2025/10/hemliga-och-preventiva-tvangsmedel-mot-barn-under-15-ar--lagandringar-trader-i-kraft/)
</div>

<aside class="notes"><p>1991 - Yttrandefrihet skrivs in i grundlagen.</p>
<ul>
<li>Alla medborgare har rätt att uttrycka sina åsikter, tankar, känslor i radio, tv, videogram, ljudupptagningar eller andra sorters upptagningar.</li>
<li>Den som är <a href="https://sv.wikipedia.org/wiki/Upphovsman" title="Upphovsman">upphovsman</a> till ett radioprogram, tv-program eller liknande har rätt att vara <a href="https://sv.wikipedia.org/wiki/Anonym" title="Anonym">anonym</a>.
1993 - Telelagen, &quot;Den som beviljas tillstånd att bedriva televerksamhet, ska bedriva den så att beslut om hemlig teleavlyssning och hemlig teleövervakning kan verkställas och så att verkställandet inte röjs.&quot;
2008 - FRA-lagen
Också kallad signalspaningslagen. All &quot;kabelburen trafik&quot; som korsar landsgränsen har FRA, Försvarets radioanstalt (Sveriges motsvarighet till NSA), har rätt att spela in och analysera i spaningssyfte.
2024 - Utökade möjligheter att använda preventiva tvångsmedel vid brottsbekämpning
Brottsbekämpande myndigheter får utökade möjligheter att använda preventiva tvångsmedel, vilket betyder att en person kan avlyssnas utan att han eller hon vet om det, även om det inte finns en konkret brottsmisstanke. Tidigare fick preventiv avlyssning enbart användas för att förhindra terrorism och spioneri. Lagen fick mycket kritik för att vara rättsosäker.
2025 - Samma lag utvidgas till att även omfatta barn under 15 år. Motivering till det är att komma åt barn som riskerar att rekryteras till gäng och begå grova brott.</li>
</ul>
<p>Alla dom här lagarna gäller fortfarande. Det är mycket lättare att tillåta något än det är att avveckla det i framtiden.</p>

</div>

<aside class="notes"><p>Vinstdrivande företag bygger upp enorma övervakningsmaskiner i syfte att tjäna pengar - det vanligaste är genom att sälja riktad reklam som driver på konsumtion. Google har inte varit primärt en sökmotor på väldigt länge, utan dom är ett reklambolag. Vad dom här bolagen bygger upp är enormt värdefulla verktyg för stater, och dom får konsumenterna att vänja sig vid tanken på att vara övervakade. Sen finns det självklart rena krigsprofitörer.</p>
</aside></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fcdn.publisher-live.etc.nu%2Fswp%2Fuc3g8l%2Fmedia%2F20251031141024_8b936593e93954e28041ca2d6b7637981a7d4b913b85d8fd7ccd4a68823e12c1.jpg" alt="&f=1&nofb=1&ipt=5ef6cda1199420900f22bb109197b0fe3f041ba2ef9460fae96ee45cb19367a0" style="object-fit: scale-down">

<aside class="notes"><p>Ett exempel som blivit känt relativt nyligen är övervakningsföretaget Palantir. Palantir säljer AI-modeller och databassystem till stater och militärer i västvärlden, och är precis ett sånt bolag som möjliggör Israels kartläggning av förmodade Hamas-anhängare som jag inledde den här presentationen med. Den svenska polisen vill inte erkänna samarbetet, men det har alltså läckt att Palantir är verksamma i Sverige. I andra länder, exempelvis Danmark, är det iallafall publikt att Palantir samarbetar med deras polis. I USA jobbar Palantir tätt med ICE för att kartlägga papperslösa. Så vad gör Palantir här i Sverige? Dom bygger upp ett register över i princip alla svenska medborgares aktivitet på internet. Läs den här artikeln, det är helt sjukt.</p>
<p>Men missta er inte, det är inte bara storbolag som samlar in all data dom kan komma över.</p>
</aside></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->

### Säkerhet

- Fysisk
- Digital
</div>

<aside class="notes"><p>Nu lämnar vi övervakning en liten stund. Vi ska prata säkerhet, åtgärder och vanor som göra övervakning ineffektivt. Jag pratar alltså inte om säkerhet som &quot;trygghet&quot;, det som myndigheter och polis försöker motivera mer övervakning med.</p>
<p>Jag kommer att prata om vad jag kallar fysisk säkerhet, alltså det som har med det fysiska rummet att göra (basically offline), och digital säkerhet som är lätt att uppfatta som mer abstrakt då den ofta är osynlig.</p>
</aside></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Fysisk säkerhet

- Var medveten om var du syns
- Var medveten om var du hörs
- "principle of least privilege"
- "Loose lips sink ships"
</div>

<aside class="notes"><p>&quot;principle of least privilege&quot;: Vem som har tillgång till vad, och generellt begränsa tillgången till information eller rum så mycket som möjligt. Det spelar såklart roll <em>vem</em> eller <em>vilka</em> som har tillgång. Det måste finnas en viss nivå av tillit, och den här principen säger att begränsa tilliten som behövs så mycket som möjligt.</p>
<p>Ju färre som har tillgång till ett rum, desto säkrare kan du vara på att ett rum inte kommer genomlysas / buggas.
Ju färre som vet något, desto mindre tillit behöver finnas att den informationen läcker.</p>
</aside></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Digital säkerhet

- Ha koll på tekniken du använder
	- Använd open source
	- "Don't trust, verify"
- Uppkopplade tjänster kräver att du avslöjar dig själv
	- Identitet (användarnamn, mail, personnummer)
	- Plats (IP-address, GPS)
	- Syfte (webbplatsbesök, mailtråd, filmtittande)
- ~Alla webbtjänster har en digital profil av dig - ["fingerprinting"](https://coveryourtracks.eff.org/)
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Digital säkerhet (forts.)

Mobilen är den största (teoretiska) säkerhetsrisken som någonsin funnits

- Alltid på dig
- Alltid påslagen
- Alltid uppkopplad
- Kopplad till dig personligen
- Nedlåsta operativsystem
- Kamera och mikrofon går sällan att slå av fysiskt
</div>

<aside class="notes"></aside></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Hotmodeller

* Vad vill du skydda?
* Vem vill du skydda det ifrån?
* Vad är sannolikheten att du måste skydda det?
* Vad är konsekvenserna om du misslyckas?
* Vad är du villig att göra för att förhindra dessa konsekvenser?
</div>

<aside class="notes"><p>Hotmodeller är . . För att etablera en hotmodell kan man ställa sig 5 frågor: <em>rabbla upp dom</em></p>
<ul>
<li><p>Vad vill du skydda?
When we are talking about digital security, what’s at stake is usually information, for example, your emails, files, and text messages. You also may want to guard against someone impersonating you, say by sending out emails from your account.</p>
</li>
<li><p>Vem vill du skydda det ifrån?
think about who might want to target you or your information. Adversaries are people or entities that pose a threat to your information. Examples of potential adversaries are your boss, your government, or a hacker on a public network.</p>
</li>
<li><p>Vad är sannolikheten att du måste skydda det?
The capability of your attacker is also an important thing to think about. For example, your mobile phone provider has access to all of your phone records and therefore has the capability to use that data against you. A hacker on an open Wi-Fi network can access your unencrypted communications. Your government likely has stronger capabilities.</p>
</li>
</ul>
<p>Risk is the likelihood that a particular threat against a particular asset will occur, and goes hand-inhand with capability. For example, while your mobile phone provider has the capability to access all of your data, the risk of them posting your private data online to harm your reputation is low.</p>
<ul>
<li>Vad är konsekvenserna om du misslyckas?
A corporation trying to track your shopping habits may be content to simply sell that information to another corporation or use it for marketing purposes, whereas a government may wish to gain access to communications in order to harass, arrest, or even kill political activists.</li>
<li>Vad är du villig att göra för att förhindra dessa konsekvenser?
Ask yourself which threats you are going to take seriously, and which may be too rare or too harmless (or too difficult to combat) to worry about.</li>
</ul>
<p><a href="https://www.eff.org/files/2015/11/24/3mod_threat-modeling-ssd_9-3-15.pdf">https://www.eff.org/files/2015/11/24/3mod_threat-modeling-ssd_9-3-15.pdf</a></p>
<p><a href="https://ssd.eff.org/playlist/want-security-starter-pack">https://ssd.eff.org/playlist/want-security-starter-pack</a></p>
</aside></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->

### <img src="IMÄI/Workshop/images/tor.png" alt="" style="width: 250px; object-fit: fill">

- Anonymiserande nätverket
	- Drivs av volontärer & statsmakter
- En webbläsare
	- All kommunikation är krypterad
	- Anti-fingerprinting inbyggt
- Övervakas kraftigt
- Anonymitet är proportionerligt mot antal användare
	- Alla borde använda Tor i solidaritet med ..
</div>

<aside class="notes"><p>Tor är ett projekt som är superviktigt för att kringå censur och övervakning på internet. Det består egentligen av två delar:</p>
<ul>
<li>Tor-nätverket är som ett helt separat internet som drivs av volontärer och diverse statsmakter (och då menar jag alla servrar). Lite klumpigt uttryckt är det vad som i folkmun kallas &quot;dark net&quot; eller &quot;deep web&quot;</li>
<li>En webbläsare. Den är baserad på Firefox, och den gör det enkelt att komma in i Tor-nätverket. Man kan även använda webbläsaren för att sufra på vanliga internet också.
Trafik i tor-nätverket övervakas super-noggrant på grund av att det är mycket brottslighet som begås på dark net (droghandel, vapenhandel osv). Men TOR ger fortfarande ett väldigt bra skydd mot massövervakning på internet, och jag kommer att förklara bättre varför i workshoppen nästa timme.</li>
</ul>
<p>TOR-projektet uppmanar även folk som inte lever under censur eller riktad övervakning att använda TOR, då det skyddar dom människor som faktiskt behöver komma åt internet på ett anonymt sätt. Det är samma argument som varför alla borde använda kontanter. Om det bara är utsatta grupper som använder kontanter blir det enklare för polisen att spåra dom, enbart på egenskapen att dom använder kontanter.</p>
</aside></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
